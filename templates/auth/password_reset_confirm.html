{% extends "core/base.html" %}
{% block password_reset_confirm %}
  <div class="container">
    <h2>Set New Password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">Reset Password</button>
    </form>
  </div>
{% endblock %}
